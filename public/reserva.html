<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservar producto - MORENA MODAS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>MORENA MODAS</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>

    </header>


    <main>

        <section class="formulario-container">

            <h2>Reservar producto</h2>

            <p>
                Completá los datos para reservar la prenda
                y probarla en nuestro local.
            </p>


            <div class="producto-reserva">

                <h3 id="nombreProducto">Remera básica</h3>

                <p>
                    <strong>Precio:</strong> $15.000
                </p>

                <p>
                    <strong>Disponibilidad:</strong> Disponible
                </p>

            </div>


            <form id="reservaForm">

                <div class="campo">

                    <label for="talle">
                        Talle
                    </label>

                    <select id="talle" name="talle" required>

                        <option value="">
                            Seleccioná un talle
                        </option>

                        <option value="S">
                            S
                        </option>

                        <option value="M">
                            M
                        </option>

                        <option value="L">
                            L
                        </option>

                        <option value="XL">
                            XL
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="color">
                        Color
                    </label>

                    <select id="color" name="color" required>

                        <option value="">
                            Seleccioná un color
                        </option>

                        <option value="Negro">
                            Negro
                        </option>

                        <option value="Blanco">
                            Blanco
                        </option>

                        <option value="Beige">
                            Beige
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="fecha">
                        Fecha para probar la prenda
                    </label>

                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="horario">
                        Horario aproximado
                    </label>

                    <select id="horario" name="horario" required>

                        <option value="">
                            Seleccioná un horario
                        </option>

                        <option value="08:00">
                            08:00 hs
                        </option>

                        <option value="09:00">
                            09:00 hs
                        </option>

                        <option value="10:00">
                            10:00 hs
                        </option>

                        <option value="11:00">
                            11:00 hs
                        </option>

                        <option value="16:00">
                            16:00 hs
                        </option>

                        <option value="17:00">
                            17:00 hs
                        </option>

                        <option value="18:00">
                            18:00 hs
                        </option>

                        <option value="19:00">
                            19:00 hs
                        </option>

                    </select>

                </div>


                <button type="submit" class="boton">
                    Confirmar reserva
                </button>

            </form>


            <p class="formulario-enlace">

                <a href="productos.html">
                    Volver a productos
                </a>

            </p>

        </section>

    </main>


    <footer>
        <p>MORENA MODAS - Sistema de consulta y reservas</p>
    </footer>

    <script src="js/reservas.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
