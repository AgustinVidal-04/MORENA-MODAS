<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - MORENA MODAS</title>

    <link rel="stylesheet" href="css/style.css">
   
</head>

<body>

    <header>

        <h1>MORENA MODAS</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>

    </header>


    <main>

        <section class="formulario-container">

            <h2>Iniciar sesión</h2>

            <p>
                Ingresá a tu cuenta para realizar y consultar tus reservas.
            </p>


            <form id="loginForm">

                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >

                </div>


                <button type="submit" class="boton">
                    Iniciar sesión
                </button>

            </form>


            <p class="formulario-enlace">
                ¿Todavía no tenés una cuenta?
                <a href="registro.html">Registrate</a>
            </p>

        </section>

    </main>


    <footer>
        <p>MORENA MODAS - Sistema de consulta y reservas</p>
    </footer>

     <script src="js/auth.js"></script>
     <script src="js/app.js"></script>

</body>

</html>
