<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - MORENA MODAS</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>MORENA MODAS</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>

    </header>


    <main>

        <section class="formulario-container">

            <h2>Crear una cuenta</h2>

            <p>
                Registrate para poder realizar reservas de prendas.
            </p>


            <form id="registroForm">

                <div class="campo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit" class="boton">
                    Registrarse
                </button>

            </form>


            <p class="formulario-enlace">
                ¿Ya tenés una cuenta?
                <a href="login.html">Iniciá sesión</a>
            </p>

        </section>

    </main>


    <footer>
        <p>MORENA MODAS - Sistema de consulta y reservas</p>
    </footer>

     <script src="js/auth.js"></script>

</body>

</html>
